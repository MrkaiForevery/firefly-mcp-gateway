eureka:
  client:
    enabled: false

server:
  port: 9560

spring:
  application:
    name: firefly-mcp-gateway
  datasource:
      url: jdbc:mysql://10.176.38.132:3306/firefly?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&autoReconnect=true
      type: com.zaxxer.hikari.HikariDataSource
      driverClassName: com.mysql.cj.jdbc.Driver
      username: "xxxx"
      password: "xxxx" #这里先写明文密码
  ai:
    mcp:
      server:
        name: firefly-streamable-http-mcp-gateway
        version: stateless-prototype-v1.0.0
        protocol: STATELESS #这个是无状态传输协议，所以不需要配置上面的额外配置
        type: SYNC
        enabled: true
        instructions: |
          你是企业MCP网关的客户端助手。
          本网关提供以下领域的能力：订单查询、用户信息查询、工单创建。
          不要尝试调用本网关未声明的能力（如支付、物流跟踪）。
          对于查询类工具，优先使用精确的ID（如订单号）而非模糊描述。
          如果工具返回权限错误，告知用户联系管理员，不要反复重试。
        request-timeout: 360s # 适当延长，给复杂查询留出时间
        stateless:
          mcp-endpoint: /monitor/stateless/mcp
          disallow-delete: false # 是否禁止 DELETE 请求，默认 false
        capabilities:
          resource: true   # 如果完全不用 Resource，直接关闭
          prompt: true     # 如果完全不用 Prompt，直接关闭
          completion: false # 关掉补全能力-用于给 Prompt 或 Resource 的 URI 提供“参数自动补全建议”（就像你在输入框里打字，下拉给提示）
        tool-change-notification: false # 工具集在编译期固定，无需运行时通知
        annotation-scanner:
          enabled: true

#logging configuration
logging:
  config: classpath:config/logback-spring.xml
  level:
    root: info
    com.cmft.ff.mcp.gateway: debug
    org.springframework.ai: debug
    io.modelcontextprotocol: debug
    com.baomidou.mybatisplus: debug
    org.springframework.web: info
    org.apache.catalina: warn
    org.springframework.boot.autoconfigure: warn

management:
  endpoints:
    web:
      exposure:
        # 显式列出需要暴露的端点（这里包含了你旧配置中想用的 metrics，以及常用的 health/info）
        # 如果还需要 shutdown，手动加进去即可，但要注意生产环境的安全风险
        include: health,info,metrics
    # 单独控制某个端点是否启用（老版本的 enabled 键名仍然兼容）
    endpoint:
      shutdown:
        enabled: true  # 如果确实需要远程关停能力再开启
      metrics:
        enabled: true
  # 管理端点独立端口（这部分语法没变）
  server:
    port: 9999



