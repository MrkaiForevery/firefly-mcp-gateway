subprojects {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    dependencies {
    }


    jar {
        manifest {
            attributes(
                    "Implementation-Title": "Gradle",
                    "Implementation-Version": "${version}",
                    "Class-Path": '. config/'
            )
        }
    }
}
